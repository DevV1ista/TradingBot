name: one-time self-dispatch integration test
on:
  push:
    branches: [feature/self-running-bot]
    paths:
      - .github/workflows/chain-integration.yml

permissions:
  actions: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Create harmless workflow_dispatch test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error --retry 2 -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/DevV1ista/TradingBot/actions/workflows/signals.yml/dispatches" \
            -d '{"ref":"feature/self-running-bot","inputs":{"job":"probe"}}'
          echo "Probe dispatched: check that probe also dispatches probe_done."
