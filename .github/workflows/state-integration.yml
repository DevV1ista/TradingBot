name: one-time state persistence test
on:
  push:
    branches: [feature/self-running-bot]
    paths:
      - .github/workflows/state-integration.yml

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/self-running-bot
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check actual GitHub state push
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          echo 'integration test' > state/_checkpoint_probe.txt
          python -c "from self_runner import checkpoint; checkpoint()"
          echo "State successfully pushed to feature branch."
