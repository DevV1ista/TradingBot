name: trading signals

# The watcher runs all trading day in 3 segments (each < 6 h, GitHub's job limit).
# Times are UTC; every segment has a summer (edt) and a winter (est) cron, the inactive one
# exits immediately. State (orders, fills, results) is committed to state/ between segments.
on:
  schedule:
    - cron: "39 4 * * 1-5"    # segment 1 summer (00:40 New York)
    - cron: "39 5 * * 1-5"    # segment 1 winter
    - cron: "29 9 * * 1-5"    # segment 2 summer (05:30 New York)
    - cron: "29 10 * * 1-5"   # segment 2 winter
    - cron: "49 14 * * 1-5"   # segment 3 summer (10:50 New York)
    - cron: "49 15 * * 1-5"   # segment 3 winter
  workflow_dispatch:
    inputs:
      job:
        description: "ping = Telegram test, replay = past day, segment = external scheduler"
        default: ping
      day:
        description: "for replay: YYYY-MM-DD (within the last ~25 days)"
        default: ""
      segment:
        description: "for job=segment: 1, 2, or 3"
        default: ""
      slot:
        description: "for job=segment: edt or est"
        default: ""

permissions:
  contents: write

concurrency:
  group: watcher-${{ (inputs.job == 'segment' && format('segment-{0}-{1}', inputs.segment, inputs.slot)) || github.event.schedule || github.run_id }}

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RISK_USD: ${{ vars.RISK_USD }}
          MAX_MICROS: ${{ vars.MAX_MICROS }}
          STRATEGY: ${{ vars.STRATEGY }}
          BROKER: ${{ vars.BROKER }}
          ACCOUNT_SIZE: ${{ vars.ACCOUNT_SIZE }}
          RISK_PCT: ${{ vars.RISK_PCT }}
          LOT_USD_XAU: ${{ vars.LOT_USD_XAU }}
          LOT_USD_US100: ${{ vars.LOT_USD_US100 }}
          RUN_JOB: ${{ inputs.job }}
          RUN_DAY: ${{ inputs.day }}
          RUN_SEGMENT: ${{ inputs.segment }}
          RUN_SLOT: ${{ inputs.slot }}
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          case "${{ github.event.schedule }}" in
            "39 4 * * 1-5")  python watcher.py --segment 1 --slot edt ;;
            "39 5 * * 1-5")  python watcher.py --segment 1 --slot est ;;
            "29 9 * * 1-5")  python watcher.py --segment 2 --slot edt ;;
            "29 10 * * 1-5") python watcher.py --segment 2 --slot est ;;
            "49 14 * * 1-5") python watcher.py --segment 3 --slot edt ;;
            "49 15 * * 1-5") python watcher.py --segment 3 --slot est ;;
            *)
              if [ "$RUN_JOB" = "segment" ]; then
                case "$RUN_SEGMENT:$RUN_SLOT" in
                  1:edt|1:est|2:edt|2:est|3:edt|3:est)
                    python watcher.py --segment "$RUN_SEGMENT" --slot "$RUN_SLOT" ;;
                  *) echo "Invalid external segment/slot" >&2; exit 1 ;;
                esac
              elif [ "$RUN_JOB" = "replay" ]; then
                python watcher.py --replay "$RUN_DAY"
              else
                python signal_bot.py ping
              fi ;;
          esac
      - name: save state
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.job == 'segment'))
        run: |
          git add state || true
          if ! git diff --cached --quiet; then
            git commit -m "state $(date -u +%F_%H%M)"
            for i in 1 2 3; do git pull --rebase --quiet && git push --quiet && break; sleep 5; done
          fi
